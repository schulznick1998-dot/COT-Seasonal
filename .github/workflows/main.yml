name: Seite aktualisieren

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: cot-js

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rechnung pruefen
        run: |
          node tests/test-mathe.js
          node tests/test-seite.js
      - name: Daten holen und Seite bauen
        run: node run-cot.js --aus site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cot-js/site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - id: seite
        uses: actions/deploy-pages@v4
